services:
  postgres:
    image: postgres:16
    container_name: auction-db
    env_file:
      - ./backend/.env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: auction-redis
    ports:
      - "6379:6379"

  django:
    build: ./backend
    container_name: auction-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.docker
    depends_on:
      - postgres
      - redis

  celery:
    build: ./backend
    container_name: auction-celery
    command: celery -A backend worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env.docker
    depends_on:
      - redis
      - django

  beat:
    build: ./backend
    container_name: auction-beat
    command: celery -A backend beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env.docker
    depends_on:
      - redis
      - django

  frontend:
    build: ./frontend
    container_name: auction-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    depends_on:
      - django

volumes:
  postgres_data: